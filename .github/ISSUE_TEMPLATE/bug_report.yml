name: Bug report
description: Report a reproducible problem without personal community data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never include bot tokens, webhook secrets, Telegram initData, real member IDs, or private location data. Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic accounts and locations.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Telegram client, browser, and hosting surface. Do not include secrets.
